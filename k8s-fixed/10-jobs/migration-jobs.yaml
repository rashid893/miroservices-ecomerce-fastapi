# ==============================================================
# MIGRATION JOBS — FIXED
#
# ROOT CAUSE of original failure:
#   1. DATABASE_URL in secret pointed to wrong hostname
#      (postgres-auth instead of auth-db)
#   2. alembic/env.py reads DATABASE_URL via pydantic settings,
#      NOT from alembic.ini — so the secret env var is critical.
#
# These jobs run AFTER databases are ready, BEFORE deployments.
# ==============================================================

# ── Auth Service Migration ────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: auth-migrate
  namespace: ecommerce
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h auth-db -p 5432 -U auth_user -d auth_db; do
                echo "Waiting for auth-db..."; sleep 2;
              done
              echo "DB ready, running migration..."
      containers:
        - name: migrate
          image: rashidbrohi/auth-service:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          # DATABASE_URL from secret — this is what alembic/env.py reads via pydantic settings
          envFrom:
            - configMapRef:
                name: auth-service-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: DATABASE_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: JWT_SECRET_KEY
---
