# ==============================================================
# GATEWAY SERVICE DEPLOYMENT
# No DB — pure proxy to auth/product/order services
# ==============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: ecommerce
  labels:
    app: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      initContainers:
        - name: wait-for-auth
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -qO- http://auth-service:8000/api/v1/health; do echo waiting for auth-service; sleep 3; done']
        - name: wait-for-product
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -qO- http://product-service:8000/api/v1/health; do echo waiting for product-service; sleep 3; done']
        - name: wait-for-order
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -qO- http://order-service:8000/api/v1/health; do echo waiting for order-service; sleep 3; done']
      containers:
        - name: gateway-service
          image: rashidbrohi/gateway-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: gateway-service-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
