# ==============================================================
# AUTH SERVICE DEPLOYMENT
# Image: built from auth-service/Dockerfile (python:3.12-slim)
# Port: 8000 | Health: GET /api/v1/health
# Runs: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000
# ==============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ecommerce
  labels:
    app: auth-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: auth-service
        version: v1
    spec:
      # Ensure pods don't all land on same node
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["auth-service"]
                topologyKey: kubernetes.io/hostname
      # Wait for DB to be available before starting
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h auth-db -U auth_user -d auth_db; do
                echo "Waiting for auth-db..."; sleep 2;
              done
      containers:
        - name: auth-service
          # Replace with your actual image registry path
          image: rashidbrohi/auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          # Load non-sensitive config
          envFrom:
            - configMapRef:
                name: auth-service-config
          # Load sensitive env vars from secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: DATABASE_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: JWT_SECRET_KEY
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Graceful shutdown
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
