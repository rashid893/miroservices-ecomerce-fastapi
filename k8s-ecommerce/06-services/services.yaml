# ==============================================================
# KUBERNETES SERVICES — ClusterIP for all microservices
# Internal DNS: <service-name>.ecommerce.svc.cluster.local
# All services run on port 8000 internally (matches Dockerfile CMD)
# ==============================================================

# ─── Auth Service ─────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ecommerce
  labels:
    app: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
# ─── Product Service ──────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: ecommerce
  labels:
    app: product-service
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
# ─── Order Service ────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce
  labels:
    app: order-service
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
# ─── Gateway Service (public-facing) ──────────────────────────
# LoadBalancer or ClusterIP (if using Ingress, use ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: ecommerce
  labels:
    app: gateway-service
spec:
  type: ClusterIP   # Use LoadBalancer if no Ingress controller
  selector:
    app: gateway-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
