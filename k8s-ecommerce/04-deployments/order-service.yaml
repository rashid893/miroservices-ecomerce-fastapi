apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-db
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              # CHANGED: Updated to 'order-db' to match your actual service name
              until pg_isready -h order-db -p 5432 -U order_user; do
                echo "Waiting for order-db..."; sleep 2;
              done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-service-secret
                  key: POSTGRES_PASSWORD
      containers:
        - name: order-service
          image: rashidbrohi/order-service:latest
          # CHANGED: Use IfNotPresent for local Docker Desktop builds
          imagePullPolicy: IfNotPresent 
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: order-service-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: order-service-secret
                  key: DATABASE_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: order-service-secret
                  key: JWT_SECRET_KEY
          # ... (rest of probes and resources remain the same)