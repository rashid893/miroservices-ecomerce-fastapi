# apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: rashidbrohi/gateway-service:latest
          # CHANGED: Better for local testing to avoid pull errors
          imagePullPolicy: IfNotPresent 
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: gateway-service-config
          # Probes: Reduce delay since Gateway starts fast (no DB)
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5