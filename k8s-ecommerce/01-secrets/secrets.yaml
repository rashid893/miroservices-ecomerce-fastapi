# ── Auth Service ──────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: ecommerce
type: Opaque
data:
  # DATABASE_URL = postgresql+asyncpg://auth_user:<CHANGE_ME>@postgres-auth:5432/auth_db
  DATABASE_URL: cG9zdGdyZXNxbCthc3luY3BnOi8vYXV0aF91c2VyOmF1dGhfcGFzc0Bwb3N0Z3Jlcy1hdXRoOjU0MzIvYXV0aF9kYg==
  # JWT_SECRET_KEY — generate with: openssl rand -hex 32
  JWT_SECRET_KEY: c3VwZXJzZWNyZXRqd3RrZXlfQ0hBTkdFX0lOX1BST0RVQ1RJT05fcGxlYXNl
  JWT_ALGORITHM: SFMyNTY=
  ACCESS_TOKEN_EXPIRE_MINUTES: MzA=
  REFRESH_TOKEN_EXPIRE_DAYS: Nw==
  # POSTGRES credentials for the auth-db StatefulSet
  POSTGRES_USER: YXV0aF91c2Vy
  POSTGRES_PASSWORD: YXV0aF9wYXNz
  POSTGRES_DB: YXV0aF9kYg==
---
