# # Replace your existing StatefulSet blocks with this structure:

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-auth # Repeat for product and order
  namespace: ecommerce
spec:
  serviceName: postgres-auth
  replicas: 1
  selector:
    matchLabels:
      app: postgres-auth
  template:
    metadata:
      labels:
        app: postgres-auth
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          # ... (keep your existing env and resources) ...
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      
      # ADD THIS SECTION HERE:
      volumes:
        - name: postgres-data
          emptyDir: {}  # This uses the node's local RAM/Disk temporarily

  # DELETE THE ENTIRE volumeClaimTemplates BLOCK AT THE BOTTOM